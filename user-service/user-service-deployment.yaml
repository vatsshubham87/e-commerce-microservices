apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  selector:
    matchLabels:
      app: user-service
  replicas: 1
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        -name: user-service
        image: user-service:latest
        imagPullPolicy: IfNotPresent
        ports:
          -containerPort: 8081